name: BIST 4H veri güncelle

on:
  schedule:
    # 06:15, 10:15, 14:15, 18:15 UTC -> BIST seansına göre yaklaşık 4 saatte bir
    # (Not: GitHub cron UTC'dir, DST'ye göre yaz/kış saatinde 1 saat kayabilir)
    - cron: "15 6,10,14,18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Veriyi çek ve hesapla
        run: python scripts/fetch_data.py

      - name: data.json değiştiyse commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi

          git commit -m "data.json güncellendi"

          # Aynı anda başka bir push olmuşsa (ör. workflow arka arkaya tetiklendiyse)
          # önce remote'u alıp rebase et, data.json çakışırsa bizim (yeni üretilen)
          # sürümü tercih et, sonra tekrar push dene.
          n=0
          until [ "$n" -ge 5 ]
          do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then
              echo "Push başarılı."
              exit 0
            fi
            n=$((n + 1))
            echo "Push başarısız, tekrar deneniyor ($n/5)..."
            git rebase --abort 2>/dev/null || true
            sleep $((n * 5))
          done

          echo "Push 5 denemeden sonra başarısız oldu."
          exit 1
